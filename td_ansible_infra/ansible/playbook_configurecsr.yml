

- name: Configuration complète du CSR1000 (interfaces, DHCP, NAT, PAT)
  hosts: csr1000
  gather_facts: false

  tasks:



    - name: Configurer les adresses IP des interfaces
      cisco.ios.ios_l3_interfaces:
        config:
          - name: GigabitEthernet1
            ipv4:
              - dhcp: true
          - name: GigabitEthernet2
            ipv4:
              - address: 192.168.2.1/24
          - name: GigabitEthernet3
            ipv4:
              - address: 192.168.3.1/24
          - name: GigabitEthernet4
            ipv4:
              - address: 192.168.4.1/24
        state: merged

    - name: Activer les interfaces et ajouter une description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "WAN - Internet (DHCP)"
            enabled: true
          - name: GigabitEthernet2
            description: "LAN_ENTREPRISE"
            enabled: true
          - name: GigabitEthernet3
            description: "LAN_DMZ - Serveur Web"
            enabled: true
          - name: GigabitEthernet4
            description: "LAN_ADMIN - Ansible"
            enabled: true
        state: merged


    - name: Supprimer les pools DHCP existants (idempotence)
      cisco.ios.ios_config:
        lines:
          - no ip dhcp pool POOL_ENTREPRISE
          - no ip dhcp pool POOL_DMZ
        match: none
      ignore_errors: true

    - name: Exclure les passerelles et IPs serveurs du DHCP
      cisco.ios.ios_config:
        lines:
          - ip dhcp excluded-address 192.168.2.1
          - ip dhcp excluded-address 192.168.3.1 192.168.3.10

    - name: Créer le pool DHCP POOL_ENTREPRISE (LAN_ENTREPRISE)
      cisco.ios.ios_config:
        parents: ip dhcp pool POOL_ENTREPRISE
        lines:
          - network 192.168.2.0 255.255.255.0
          - default-router 192.168.2.1
          - dns-server 8.8.8.8 1.1.1.1

    - name: Créer le pool DHCP POOL_DMZ (LAN_DMZ)
      cisco.ios.ios_config:
        parents: ip dhcp pool POOL_DMZ
        lines:
          - network 192.168.3.0 255.255.255.0
          - default-router 192.168.3.1
          - dns-server 8.8.8.8 1.1.1.1



    - name: Marquer GigabitEthernet1 comme NAT outside (interface WAN)
      cisco.ios.ios_config:
        parents: interface GigabitEthernet1
        lines:
          - ip nat outside

    - name: Marquer GigabitEthernet 2, 3 et 4 comme NAT inside (LAN)
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - ip nat inside
      loop:
        - GigabitEthernet2
        - GigabitEthernet3
        - GigabitEthernet4

    - name: Créer une ACL standard (numéro 10) autorisant les LAN internes
      cisco.ios.ios_config:
        lines:
          - access-list 10 permit 192.168.2.0 0.0.0.255
          - access-list 10 permit 192.168.3.0 0.0.0.255
          - access-list 10 permit 192.168.4.0 0.0.0.255

    - name: Activer le PAT dynamique (NAT overload) vers GigabitEthernet1
      cisco.ios.ios_config:
        lines:
          - ip nat inside source list 10 interface GigabitEthernet1 overload



    - name: Configurer les redirections de ports (PAT statique)
      cisco.ios.ios_config:
        lines:
          - "ip nat inside source static tcp {{ item.ip_lan }} {{ item.port_lan }} interface GigabitEthernet1 {{ item.port_wan }}"
      loop:
        - { ip_lan: '192.168.3.2', port_lan: 80, port_wan: 80 }
        - { ip_lan: '192.168.4.2', port_lan: 22, port_wan: 2222 }



    - name: Sauvegarder la configuration courante en startup-config
      cisco.ios.ios_config:
        save_when: always
