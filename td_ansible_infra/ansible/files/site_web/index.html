<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Ansible - Mon Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f0f8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .author {
            font-size: 1.2em;
            color: #34495e;
            margin: 15px 0;
            font-weight: bold;
        }
        .module {
            color: #7f8c8d;
            font-size: 0.95em;
            margin-top: 10px;
        }
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
            color: #95a5a6;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 Site déployé via Ansible</h1>
        <p class="author">Ponthieux Léo</p>
        <p class="module">R4.ROM.09 - DevOps Infra Réseau</p>
        <p class="footer">Déploiement automatisé avec Ansible sur Apache2</p>
    </div>
</body>
</html>
